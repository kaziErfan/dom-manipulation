<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            background-color: #222;
        }
        #main{
            padding-top:80px;
            width: 100%;
            height: 100%;
            color: #999;
            text-align: center;
        }
        #main form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        input{
            display: block;
            margin-bottom: 10px;
            padding: 10px;
           
        }
        .card{
            max-width: 300px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            margin: 0px 10px;
        }
        .card p{
            font-size: 15px;
            line-height: 18px;
            margin-top: 10px;
        }
        .card h5{
            font-size: 18px;
            margin: 0;
        }
        .card h3{
            font-size: 24px;
            margin: 20px 0px 16px 0px;
        }
        .profile{
            width: 60px;
            height: 60px;
            background-color: red;
            border-radius: 50%;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="url" placeholder="profile pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="occupation">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>

    </div>
    </div>
    

    <!-- Javascript -->
    <script src="./form.js"></script>
</body>

</html>
