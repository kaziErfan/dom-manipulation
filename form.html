<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            background-color: #222;
        }
        #main{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top:80px;
            width: 100%;
            height: 100%;
            color: #999;
        }
        input{
            display: block;
            margin-bottom: 10px;
            padding: 10px;
           
        }
        .card{
            max-width: 300px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
        }
        .card p{
            font-size: 15px;
            line-height: 18px;
            margin-top: 10px;
        }
        .card h5{
            font-size: 18px;
            margin: 0;
        }
        .card h3{
            font-size: 24px;
            margin: 20px 0px 16px 0px;
        }
        .profile{
            width: 60px;
            height: 60px;
            background-color: red;
            border-radius: 50%;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="name">
            <input type="text" placeholder="age">
            <input type="email" placeholder="email">
            <input type="text" placeholder="profile pic">
            <input type="submit">
        </form>

        <div class="card">
            <div class="profile">
                <img src="https://images.unsplash.com/photo-1765834082631-bb4373ecafef?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw1OXx8fGVufDB8fHx8fA%3D%3D" alt="">
            </div>
            <h3>Erfan Tamim</h3>
            <h5>Creative Coder</h5>
            <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Non, doloribus dicta? Sequi mollitia asperiores incidunt placeat? Maxime esse aliquam beatae, atque sapiente rem?</p>
        </div>

    </div>
    </div>
    

    <!-- Javascript -->
    <script src="./form.js"></script>
</body>

</html>
