<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        body{
            background-color: #222;
        }
        #main{
            padding-top: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #999;
        }
        input{
            display: block;
            margin-bottom: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="name">
            <input type="text" placeholder="age">
            <input type="email" placeholder="email">
            <input type="text" placeholder="profile pic">
            <input type="submit">
        </form>
    </div>

    <!-- Javascript -->
    <script src="./form.js"></script>
</body>

</html>
