<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #222;
            color: #fff;
            padding: 60px;
        }
        
        input, textarea{
            padding: 10px 20px;
        }
        #hide{
            display: none;
        }
        small{
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div>
        <form action="">
            <input type="text" id="name" placeholder="Name">
            <br>
            <div id="hide">
                <small>your name should be more than 2 characters</small>
                <br>
            </div>
            <br>
            <input type="email" name="" placeholder="Email">
            <br><br>
            <input type="password" placeholder="Password">
            <br><br>
            <select name="">
                <option value="Male">Male</option>
                <option value="female">Female</option>
            </select>
            <br><br>
            <textarea name="" placeholder="Tell about yourself"></textarea>
            <br><br>
            <input type="submit">
        </form>
    </div>
    <script src="formValidation.js"></script>
</body>
</html>
