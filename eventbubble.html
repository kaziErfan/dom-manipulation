<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubble</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            width: 100%;
            height: 100%;
            background-color: #222;
        }
        ul{
            color: #fff;
            padding: 60px;
            line-height: 36px;
        }
        ul li{
            font-size: 28px;

        }
        .lt{
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div>
        <ul>
            <li>Apple</li>
            <li>Orange</li>
            <li>Avocado</li>
            <li>Banana</li>
            <li>Guava</li>
        </ul>
    </div>

    <script src="./eventbubble.js"></script>

</html>
